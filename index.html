<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFP Tech FL | Microsoft 365 Solutions</title>

:root{
    --primary:#00A3FF;
    --secondary:#00E5FF;
    --accent:#7B61FF;
    --dark:#060b18;
    --dark2:#0d1324;
    --text:#ffffff;
    --glass:rgba(255,255,255,.06);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--dark);
    color:white;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#00A3FF33 0%,transparent 35%),
    radial-gradient(circle at bottom right,#7B61FF33 0%,transparent 35%);
    z-index:-1;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

/* NAVBAR */

nav{
    position:fixed;
    width:100%;
    top:0;
    backdrop-filter:blur(15px);
    background:rgba(6,11,24,.75);
    z-index:999;
}

.nav-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 5%;
}

.logo{
    font-size:1.5rem;
    font-weight:800;
    color:var(--secondary);
}

.menu{
    display:flex;
    gap:25px;
}

.menu a{
    text-decoration:none;
    color:white;
    transition:.3s;
}

.menu a:hover{
    color:var(--secondary);
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
}

.hero-content{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.hero-text h1{
    font-size:4rem;
    line-height:1.1;
    margin-bottom:20px;
}

.gradient{
    background:linear-gradient(
    90deg,
    var(--primary),
    var(--secondary),
    var(--accent)
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero-text p{
    color:#cfd8e3;
    font-size:1.1rem;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:15px 28px;
    border-radius:12px;
    font-weight:700;
    transition:.3s;
}

.btn-primary{
    background:linear-gradient(
      90deg,
      var(--primary),
      var(--secondary)
    );
    color:white;
}
