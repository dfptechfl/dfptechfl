<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">

  <defs>
    <linearGradient id="dfpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
