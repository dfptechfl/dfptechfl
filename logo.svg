        stroke-width="8"/>

  <circle cx="250" cy="30" r="10"
          fill="#00E5FF"/>

  <line x1="375" y1="185" x2="430" y2="170"
        stroke="#00E5FF"
        stroke-width="8"/>

  <circle cx="445" cy="165" r="10"
          fill="#00E5FF"/>

  <line x1="375" y1="315" x2="430" y2="330"
        stroke="#00E5FF"
        stroke-width="8"/>

  <circle cx="445" cy="335" r="10"
          fill="#00E5FF"/>

  <!-- DFP -->
  <text
      x="250"
      y="275"
      text-anchor="middle"
      fill="#FFFFFF"
